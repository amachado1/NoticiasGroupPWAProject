<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087cb8" />
    <title>Sin conexión | Noticias Group</title>
    <style>
      :root { color: #27323a; background: #fff; font-family: Arial, Helvetica, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { width: min(34rem, calc(100% - 2rem)); text-align: center; }
      img { display: block; width: min(15rem, 80%); height: auto; margin: 0 auto 2rem; }
      h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); }
      p { color: #69737a; line-height: 1.65; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; background: #087cb8; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand-logo.webp" alt="Noticias Group" />
      <h1>Estás sin conexión</h1>
      <p>Conéctate a internet para ver las noticias actuales. Los artículos no están disponibles sin conexión.</p>
      <a href="/">Intentar de nuevo</a>
    </main>
  </body>
</html>
